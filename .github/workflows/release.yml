name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate artifacts without publishing"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-rc*"

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate release version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          ref_type = os.environ.get("GITHUB_REF_TYPE")
          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          init_text = Path("src/code_review_loop/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__ = "([^"]+)"$', init_text, re.MULTILINE)
          if match is None:
              raise SystemExit("__version__ not found")
          version = match.group(1)
          expected_tags = {f"v{version}"}
          if "rc" in version:
              expected_tags.add(f"v{version.replace('rc', '-rc')}")
          if ref_type == "tag" and ref_name not in expected_tags:
              raise SystemExit(f"release tag {ref_name!r} does not match package version {version!r}")
          print(f"version={version}")
          PY

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "meminit @ git+https://github.com/GitCmurf/meminit.git@63547bc79f46200d25e4b7375b5c661f64aa34f8"
          pytest -q
          ruff check .
          mypy src

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          rm -rf dist build src/revrem.egg-info src/code_review_loop.egg-info
          python -m build --sdist --wheel
          python -m twine check dist/*

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/revrem-sbom.cdx.json

      - name: Generate SHA-256 checksums
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          with Path("dist/SHA256SUMS").open("w", encoding="utf-8") as handle:
              for path in sorted(Path("dist").iterdir()):
                  if path.name == "SHA256SUMS" or not path.is_file():
                      continue
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  handle.write(f"{digest}  {path.name}\n")
          PY

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Sign release artifacts
        if: github.event_name == 'push' || inputs.dry_run == 'false'
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: dist/*

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: dist/*

      - name: Stage release assets and clean dist for publishing
        run: |
          mkdir -p release-assets
          cp dist/* release-assets/
          # OpenSSF Scorecard's signed-releases check recognises the *.sigstore
          # suffix, not *.sigstore.json. Add a recognised-name copy of each
          # Sigstore bundle so the check credits the signing we already do; the
          # canonical *.sigstore.json bundle is kept for standard verification.
          for bundle in release-assets/*.sigstore.json; do
            [ -e "$bundle" ] || continue
            cp "$bundle" "${bundle%.json}"
          done
          cd dist && for f in *; do
            case "$f" in *.whl|*.tar.gz) ;; *) rm -f "$f" ;; esac
          done

      - name: Extract release notes from CHANGELOG
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import os, re, pathlib
          ref = os.environ["GITHUB_REF_NAME"]            # e.g. v0.4.0 or v0.4.0-rc1
          version = ref[1:] if ref.startswith("v") else ref
          version = version.replace("-rc", "rc")          # CHANGELOG uses 0.4.0rc1 form if present
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(rf"^## \[{re.escape(version)}\].*?(?=^## \[|\Z)", text, re.M | re.S)
          notes = match.group(0).strip() if match else f"Release {ref}."
          pathlib.Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          print(notes[:200])
          PY

      - name: Publish to TestPyPI
        if: github.event_name == 'push' && contains(github.ref_name, 'rc')
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

      - name: Publish to PyPI
        if: github.event_name == 'push' && !contains(github.ref_name, 'rc')
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

      - name: Publish GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          files: release-assets/*
